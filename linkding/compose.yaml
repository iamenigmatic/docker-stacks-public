services:
  linkding:
    container_name: Linkding
    image: sissbruecker/linkding:latest
    ports:
      - 9496:9090
    volumes:
      - /volume1/docker/linkding:/etc/linkding/data:rw
    environment:
       LD_SUPERUSER_NAME: ${LD_SUPERUSER_NAME}
       LD_SUPERUSER_PASSWORD: ${LD_SUPERUSER_PASSWORD}
       LD_ENABLE_OIDC: ${LD_ENABLE_OIDC}
       OIDC_RP_CLIENT_ID: ${OIDC_RP_CLIENT_ID}
       OIDC_RP_CLIENT_SECRET: ${OIDC_RP_CLIENT_SECRET}
       OIDC_OP_AUTHORIZATION_ENDPOINT: ${OIDC_OP_AUTHORIZATION_ENDPOINT}
       OIDC_OP_TOKEN_ENDPOINT: ${OIDC_OP_TOKEN_ENDPOINT}
       OIDC_OP_USER_ENDPOINT: ${OIDC_OP_USER_ENDPOINT}
       OIDC_OP_JWKS_ENDPOINT: ${OIDC_OP_JWKS_ENDPOINT}
       OIDC_USE_PKCE: ${OIDC_USE_PKCE}
       OIDC_VERIFY_SSL: ${OIDC_VERIFY_SSL}
       LD_DISABLE_LOGIN_FORM: ${LD_DISABLE_LOGIN_FORM}
    restart: on-failure:5
    networks:
      - group1

networks:
  group1:
    external: true  # Use an existing network